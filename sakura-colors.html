<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura Colors 🌸🎨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fff5f7',
                            100: '#ffeef2',
                            200: '#ffdbe4',
                            300: '#ffb7ca',
                            400: '#ff85a3',
                            500: '#ff547d',
                            600: '#eb2c5b',
                            700: '#c71946',
                            800: '#a5173e',
                            900: '#8b183a',
                            card: 'rgba(255, 255, 255, 0.75)',
                        }
                    },
                    fontFamily: {
                        sans: ['Comfortaa', 'Quicksand', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* O GIF animado de fundo */
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('download.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #4a343a;
            overflow-x: hidden;
            position: relative;
        }

        /* A barra rosa do topo com a imagem original */
        .glass-nav {
            background: linear-gradient(rgba(255, 227, 232, 0.85), rgba(255, 227, 232, 0.85)), url('7 Sem Título_20261108005507.png');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 183, 202, 0.4);
        }

        /* Efeito Glassmorphism para os Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 183, 202, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 227, 232, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #ff85a3;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff547d;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sakura-300 selection:text-sakura-900">

    <!-- Header Navigation -->
    <header class="fixed top-0 left-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between relative z-10">
            <!-- Logo voltando para a página principal -->
            <a href="index.html" class="flex items-center gap-3 group">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sakura-400 to-sakura-300 flex items-center justify-center text-white text-xl shadow-md group-hover:rotate-12 transition-transform duration-300">
                    🎨
                </div>
                <div class="flex flex-col">
                    <span class="font-['Comfortaa'] font-bold text-lg sm:text-xl text-sakura-900 tracking-tight">
                        Sakura <span class="text-sakura-500">Colors</span>
                    </span>
                    <span class="text-[10px] text-sakura-700 font-mono">- mini app de paletas -</span>
                </div>
            </a>

            <!-- Menu -->
            <nav class="flex items-center gap-4 font-semibold text-sm text-sakura-900">
                <a href="index.html" class="px-4 py-2 rounded-full glass-card hover:bg-white transition-all flex items-center gap-2">
                    <i class="fa-solid fa-house text-sakura-500"></i> Voltar ao Início
                </a>
            </nav>
        </div>
    </header>

    <!-- Content Wrapper -->
    <main class="relative z-10 pt-32 pb-16 flex-grow max-w-4xl mx-auto px-4 sm:px-6 w-full">
        
        <!-- Header da Seção -->
        <div class="text-center max-w-xl mx-auto mb-10 space-y-3">
            <span class="text-xs font-mono uppercase tracking-widest text-sakura-200 font-bold drop-shadow">// FERRAMENTA AESTHETIC</span>
            <h1 class="text-3xl sm:text-4xl font-['Comfortaa'] font-bold text-white drop-shadow">Sakura Palette Picker ✨</h1>
            <p class="text-sm text-white/95 drop-shadow">Gere paletas de cores suaves em tons pastel e copie o código HEX com um clique!</p>
        </div>

        <!-- Card Principal do Gerador -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 space-y-6 shadow-2xl">
            
            <!-- Paleta de Cores Ativa (5 blocos) -->
            <div id="palette-container" class="grid grid-cols-1 sm:grid-cols-5 gap-4">
                <!-- Blocos gerados via JavaScript -->
            </div>

            <!-- Botões de Ação -->
            <div class="flex flex-wrap justify-center gap-4 pt-2">
                <button onclick="generatePalette()" class="px-6 py-3.5 rounded-2xl bg-sakura-500 text-white font-bold text-sm shadow-lg hover:bg-sakura-600 hover:shadow-sakura-300/50 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles text-lg"></i> Gerar Nova Paleta
                </button>
            </div>

            <!-- Feedback de Cópia Toast -->
            <div id="copy-toast" class="hidden text-xs font-bold text-green-600 bg-green-100 border border-green-300 px-4 py-2 rounded-full w-max mx-auto animate-bounce">
                ✨ Cor copiada para a área de transferência!
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="relative z-10 border-t border-white/20 py-8 text-center text-xs text-white/90 font-medium drop-shadow">
        <p>Feito com 🌸 e carinho por Ayzin • Casinha do Ayzin</p>
    </footer>

    <!-- Lógica JS do Sakura Colors -->
    <script>
        // Lista de paletas com tema Sakura / Pastel / Aesthetic predefinidas
        const sakuraPalettes = [
            ["#ffdbe4", "#ffb7ca", "#ff85a3", "#ff547d", "#fff5f7"],
            ["#ffeef2", "#ffc2d1", "#ff7096", "#c71946", "#8b183a"],
            ["#e0f2fe", "#bae6fd", "#7dd3fc", "#38bdf8", "#0284c7"],
            ["#f3e8ff", "#e9d5ff", "#c084fc", "#a855f7", "#7e22ce"],
            ["#dcfce7", "#bbf7d0", "#86efac", "#4ade80", "#22c55e"],
            ["#fef3c7", "#fde68a", "#fcd34d", "#fbbf24", "#f59e0b"],
            ["#fff1f2", "#ffe4e6", "#fecdd3", "#fda4af", "#fb7185"]
        ];

        const container = document.getElementById('palette-container');
        const toast = document.getElementById('copy-toast');

        function renderPalette(colors) {
            container.innerHTML = colors.map(color => `
                <div class="flex flex-col items-center gap-2 group">
                    <div onclick="copyColor('${color}')" 
                         class="w-full h-36 sm:h-48 rounded-2xl shadow-md cursor-pointer transition-transform duration-300 group-hover:scale-105 border border-white/60 flex items-end justify-center pb-3"
                         style="background-color: ${color};"
                         title="Clique para copiar">
                        <span class="opacity-0 group-hover:opacity-100 bg-white/90 text-sakura-900 font-mono text-[11px] px-2 py-1 rounded-md shadow transition-opacity">
                            Copiar
                        </span>
                    </div>
                    <span onclick="copyColor('${color}')" class="font-mono text-xs font-bold text-sakura-900 cursor-pointer hover:text-sakura-500 transition-colors">
                        ${color.toUpperCase()}
                    </span>
                </div>
            `).join('');
        }

        function generatePalette() {
            // Sorteia uma das paletas estéticas
            const randomIndex = Math.floor(Math.random() * sakuraPalettes.length);
            renderPalette(sakuraPalettes[randomIndex]);
        }

        function copyColor(hex) {
            navigator.clipboard.writeText(hex).then(() => {
                toast.textContent = `✨ Cor ${hex.toUpperCase()} copiada!`;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 2000);
            });
        }

        // Inicializa gerando uma paleta
        generatePalette();
    </script>
</body>
</html>
