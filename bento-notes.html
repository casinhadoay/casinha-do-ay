<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bento Box Notes 🍱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fff5f7',
                            100: '#ffeef2',
                            200: '#ffdbe4',
                            300: '#ffb7ca',
                            400: '#ff85a3',
                            500: '#ff547d',
                            600: '#eb2c5b',
                            700: '#c71946',
                            800: '#a5173e',
                            900: '#8b183a',
                            card: 'rgba(255, 255, 255, 0.92)',
                        }
                    },
                    fontFamily: {
                        sans: ['Comfortaa', 'Quicksand', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('download.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #4a343a;
            overflow-x: hidden;
            position: relative;
        }

        .glass-nav {
            background: linear-gradient(rgba(255, 227, 232, 0.9), rgba(255, 227, 232, 0.9)), url('7 Sem Título_20261108005507.png');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 183, 202, 0.4);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 183, 202, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 227, 232, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #ff85a3;
            border-radius: 999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sakura-300 selection:text-sakura-900">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-sakura-900 text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
        <span id="toast-icon">🍱</span>
        <span id="toast-msg">Mensagem</span>
    </div>

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-40 glass-nav transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between relative z-10">
            <a href="index.html" class="flex items-center gap-2.5 sm:gap-3 group">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-sakura-400 to-pink-400 flex items-center justify-center text-white text-lg sm:text-xl shadow-md group-hover:rotate-12 transition-transform duration-300">
                    🍱
                </div>
                <div class="flex flex-col">
                    <span class="font-['Comfortaa'] font-bold text-base sm:text-xl text-sakura-900 tracking-tight">
                        Bento Box <span class="text-sakura-500">Notes</span>
                    </span>
                    <span class="text-[9px] sm:text-[10px] text-sakura-700 font-mono">- Suas Anotações Individuais -</span>
                </div>
            </a>

            <a href="index.html" class="px-3.5 py-1.5 rounded-full bg-sakura-500 text-white hover:bg-sakura-600 text-xs font-semibold shadow transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-house"></i> Casinha
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 pt-28 pb-12 flex-grow max-w-4xl mx-auto px-4 sm:px-6 w-full space-y-6">

        <div class="flex flex-wrap items-center justify-between gap-4 glass-card p-4 sm:p-5 rounded-3xl">
            <div>
                <h1 class="text-xl sm:text-2xl font-['Comfortaa'] font-bold text-sakura-900">Sua Marmitinha de Notas ✨</h1>
                <p class="text-xs text-sakura-700 mt-1">Crie divisórias e anotações que ficam salvas individualmente no seu navegador!</p>
            </div>
            <button type="button" onclick="openNewNoteModal()" class="px-4 py-2.5 rounded-2xl bg-sakura-500 text-white font-bold text-xs shadow-md hover:bg-sakura-600 transition-all flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-plus"></i> Nova Notinha
            </button>
        </div>

        <!-- Grade de Notas (Estilo Bento Box) -->
        <div id="notes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- As notas salvas do usuário aparecem aqui -->
        </div>

    </main>

    <!-- Modal: Adicionar / Editar Nota -->
    <div id="note-modal" class="fixed inset-0 z-50 bg-sakura-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="glass-card bg-white/95 border border-sakura-300 rounded-3xl max-w-md w-full p-6 relative space-y-4 shadow-2xl">
            <button type="button" onclick="closeNoteModal()" class="absolute top-4 right-4 text-sakura-600 hover:text-sakura-900 text-lg w-8 h-8 rounded-full bg-sakura-100 flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="modal-title" class="text-lg font-['Comfortaa'] font-bold text-sakura-900">Criar Nova Notinha 🍱</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-sakura-900 mb-1">Título da Divisória</label>
                    <input type="text" id="note-title" placeholder="Ex: Ideias de Código, Compras..." class="w-full px-3.5 py-2 rounded-xl border border-sakura-200 text-xs text-sakura-900 focus:outline-none focus:border-sakura-500 bg-white/80">
                </div>
                <div>
                    <label class="block text-xs font-bold text-sakura-900 mb-1">Sua Anotação</label>
                    <textarea id="note-content" rows="4" placeholder="Escreva seus pensamentos aqui..." class="w-full px-3.5 py-2 rounded-xl border border-sakura-200 text-xs text-sakura-900 focus:outline-none focus:border-sakura-500 bg-white/80 resize-none"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeNoteModal()" class="px-4 py-2 rounded-xl glass-card text-sakura-900 font-bold text-xs border border-sakura-300 shadow cursor-pointer">Cancelar</button>
                <button type="button" onclick="saveNote()" class="px-4 py-2 rounded-xl bg-sakura-500 text-white font-bold text-xs hover:bg-sakura-600 shadow cursor-pointer">Salvar Nota</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="relative z-10 border-t border-white/20 py-6 text-center text-[11px] sm:text-xs text-white/90 font-medium drop-shadow">
        <p>Feito com 🌸 e carinho por Ayzin • Bento Box Notes Individual</p>
    </footer>

    <!-- Script de Gerenciamento Individual LocalStorage -->
    <script>
        let notes = JSON.parse(localStorage.getItem('bento_notes_user')) || [
            { id: '1', title: '🌸 Bem-vindo(a)!', content: 'Estas anotações são salvas individualmente no seu navegador. Sinta-se livre para criar, editar ou apagar!' }
        ];

        let editingId = null;

        function showToast(msg, icon = '🍱') {
            const toast = document.getElementById('toast');
            if(!toast) return;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-icon').textContent = icon;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function saveToStorage() {
            localStorage.setItem('bento_notes_user', JSON.stringify(notes));
            renderNotes();
        }

        function renderNotes() {
            const grid = document.getElementById('notes-grid');
            if(!grid) return;
            grid.innerHTML = '';

            if(notes.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 glass-card rounded-3xl p-6 text-sakura-800">
                        <span class="text-4xl block mb-2">🍽️</span>
                        <p class="text-xs font-bold">Sua marmitinha está vazia!</p>
                        <p class="text-[11px] text-sakura-700 mt-1">Clique em "Nova Notinha" para começar.</p>
                    </div>
                `;
                return;
            }

            notes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'glass-card p-5 rounded-3xl flex flex-col justify-between space-y-3 relative group border border-sakura-200 shadow-md hover:shadow-lg transition-all';
                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center justify-between">
                            <h3 class="font-['Comfortaa'] font-bold text-sm text-sakura-900">${escapeHtml(note.title)}</h3>
                            <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100 transition-opacity">
                                <button type="button" onclick="editNote('${note.id}')" class="w-7 h-7 rounded-lg bg-sakura-100 hover:bg-sakura-200 text-sakura-700 text-xs flex items-center justify-center cursor-pointer" title="Editar">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button type="button" onclick="deleteNote('${note.id}')" class="w-7 h-7 rounded-lg bg-pink-100 hover:bg-pink-200 text-pink-700 text-xs flex items-center justify-center cursor-pointer" title="Excluir">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-xs text-sakura-800/90 whitespace-pre-wrap leading-relaxed pt-1">${escapeHtml(note.content)}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function openNewNoteModal() {
            editingId = null;
            document.getElementById('modal-title').textContent = "Criar Nova Notinha 🍱";
            document.getElementById('note-title').value = '';
            document.getElementById('note-content').value = '';
            document.getElementById('note-modal').classList.remove('hidden');
            document.getElementById('note-modal').classList.add('flex');
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if(!note) return;
            editingId = id;
            document.getElementById('modal-title').textContent = "Editar Notinha ✏️";
            document.getElementById('note-title').value = note.title;
            document.getElementById('note-content').value = note.content;
            document.getElementById('note-modal').classList.remove('hidden');
            document.getElementById('note-modal').classList.add('flex');
        }

        function closeNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
            document.getElementById('note-modal').classList.remove('flex');
        }

        function saveNote() {
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-content').value.trim();

            if(!title || !content) {
                showToast("Preencha o título e o conteúdo!", "❌");
                return;
            }

            if(editingId) {
                const note = notes.find(n => n.id === editingId);
                if(note) {
                    note.title = title;
                    note.content = content;
                }
                showToast("Nota atualizada com sucesso! ✨", "✏️");
            } else {
                const newNote = {
                    id: 'note_' + Date.now(),
                    title: title,
                    content: content
                };
                notes.push(newNote);
                showToast("Nova notinha criada na sua marmitinha! 🍱", "🎉");
            }

            saveToStorage();
            closeNoteModal();
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveToStorage();
            showToast("Nota removida com sucesso!", "🗑️");
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderNotes();
        });
    </script>
</body>
</html>
