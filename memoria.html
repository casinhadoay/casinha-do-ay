<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória Retro 🍡</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fff5f7',
                            100: '#ffeef2',
                            200: '#ffdbe4',
                            300: '#ffb7ca',
                            400: '#ff85a3',
                            500: '#ff547d',
                            600: '#eb2c5b',
                            700: '#c71946',
                            800: '#a5173e',
                            900: '#8b183a',
                            card: 'rgba(255, 255, 255, 0.92)',
                        }
                    },
                    fontFamily: {
                        sans: ['Comfortaa', 'Quicksand', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('download.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #4a343a;
            overflow-x: hidden;
            position: relative;
        }

        .glass-nav {
            background: linear-gradient(rgba(255, 227, 232, 0.9), rgba(255, 227, 232, 0.9)), url('7 Sem Título_20261108005507.png');
            background-size: cover;
            background-position: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 183, 202, 0.4);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 183, 202, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        }

        /* Animação e Estilo das Cartas */
        .card-inner {
            transform-style: preserve-3d;
            transition: transform 0.4s ease;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 227, 232, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #ff85a3;
            border-radius: 999px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sakura-300 selection:text-sakura-900">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-sakura-900 text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-xl transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
        <span id="toast-icon">🍡</span>
        <span id="toast-msg">Mensagem</span>
    </div>

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-40 glass-nav transition-all duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between relative z-10">
            <a href="index.html" class="flex items-center gap-2.5 sm:gap-3 group">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-pink-400 to-sakura-400 flex items-center justify-center text-white text-lg sm:text-xl shadow-md group-hover:rotate-12 transition-transform duration-300">
                    🍡
                </div>
                <div class="flex flex-col">
                    <span class="font-['Comfortaa'] font-bold text-base sm:text-xl text-sakura-900 tracking-tight">
                        Jogo da <span class="text-sakura-500">Memória</span>
                    </span>
                    <span class="text-[9px] sm:text-[10px] text-sakura-700 font-mono">- Retro & Doces -</span>
                </div>
            </a>

            <!-- Estatísticas e Voltar -->
            <div class="flex items-center gap-3">
                <div class="glass-card px-3 py-1.5 rounded-full text-xs font-bold text-sakura-900 flex items-center gap-1.5 shadow-sm border border-sakura-300">
                    <span>⏱️</span> <span id="timer">00:00</span>
                </div>
                <div class="glass-card px-3 py-1.5 rounded-full text-xs font-bold text-sakura-900 flex items-center gap-1.5 shadow-sm border border-sakura-300">
                    <span>👆</span> <span id="moves">0</span> Movimentos
                </div>
                <a href="index.html" class="px-3.5 py-1.5 rounded-full bg-sakura-500 text-white hover:bg-sakura-600 text-xs font-semibold shadow transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-house"></i> Casinha
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 pt-28 pb-12 flex-grow max-w-2xl mx-auto px-4 sm:px-6 w-full space-y-6 flex flex-col items-center justify-center">

        <div class="text-center space-y-2">
            <h1 class="text-2xl sm:text-3xl font-['Comfortaa'] font-bold text-white drop-shadow">Jogo da Memória Retro ✨</h1>
            <p class="text-xs sm:text-sm text-white/90 drop-shadow">Encontre os pares de doces japoneses escondidos nas cartas!</p>
        </div>

        <!-- Tabuleiro do Jogo -->
        <div id="game-board" class="grid grid-cols-4 gap-3 sm:gap-4 w-full max-w-md mx-auto py-2">
            <!-- As cartas serão geradas via JavaScript -->
        </div>

        <!-- Botão Reiniciar -->
        <button type="button" onclick="startGame()" class="px-6 py-2.5 rounded-2xl bg-sakura-500 text-white font-bold text-xs shadow-lg hover:bg-sakura-600 transition-all flex items-center gap-2 cursor-pointer">
            <i class="fa-solid fa-rotate-right"></i> Reiniciar Jogo
        </button>
    </main>

    <!-- Modal de Vitória -->
    <div id="win-modal" class="fixed inset-0 z-50 bg-sakura-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="glass-card bg-white/95 border border-sakura-300 rounded-3xl max-w-sm w-full p-6 text-center relative space-y-4 shadow-2xl">
            <div class="text-5xl">🎉</div>
            <h3 class="text-xl font-['Comfortaa'] font-bold text-sakura-900">Parabéns, Você Venceu!</h3>
            <p id="win-stats" class="text-xs text-sakura-800 leading-relaxed"></p>
            <div class="flex justify-center gap-3 pt-2">
                <button type="button" onclick="closeWinModal(); startGame();" class="px-4 py-2 rounded-xl bg-sakura-500 text-white font-bold text-xs hover:bg-sakura-600 shadow cursor-pointer">Jogar de Novo</button>
                <a href="index.html" class="px-4 py-2 rounded-xl glass-card text-sakura-900 font-bold text-xs border border-sakura-300 shadow flex items-center justify-center">Voltar à Casinha</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="relative z-10 border-t border-white/20 py-6 text-center text-[11px] sm:text-xs text-white/90 font-medium drop-shadow">
        <p>Feito com 🌸 e carinho por Ayzin • Jogo da Memória Retro</p>
    </footer>

    <!-- Script do Jogo da Memória -->
    <script>
        const symbols = ['🍡', '🌸', '🍵', '🍓', '🍙', '🐱', '🍡', '🌸', '🍵', '🍓', '🍙', '🐱'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let timer = 0;
        let timerInterval = null;
        let isLocked = false;

        function showToast(msg, icon = '🍡') {
            const toast = document.getElementById('toast');
            if(!toast) return;
            document.getElementById('toast-msg').textContent = msg;
            document.getElementById('toast-icon').textContent = icon;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function startGame() {
            clearInterval(timerInterval);
            timer = 0;
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isLocked = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('win-modal').classList.remove('flex');

            // Embaralhar cartas
            const shuffled = [...symbols].sort(() => Math.random() - 0.5);
            const board = document.getElementById('game-board');
            board.innerHTML = '';

            shuffled.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'card h-20 sm:h-24 rounded-2xl cursor-pointer perspective-1000';
                card.dataset.symbol = symbol;

                card.innerHTML = `
                    <div class="card-inner relative w-full h-full rounded-2xl shadow-md">
                        <div class="card-front absolute inset-0 glass-card rounded-2xl flex items-center justify-center text-2xl font-bold text-sakura-500 border border-sakura-300 bg-white/9oomla hover:bg-white transition-colors">
                            🌸
                        </div>
                        <div class="card-back absolute inset-0 bg-gradient-to-tr from-sakura-300 to-pink-300 rounded-2xl flex items-center justify-center text-3xl shadow-inner border border-white">
                            ${symbol}
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                const mins = String(Math.floor(timer / 60)).padStart(2, '0');
                const secs = String(timer % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function flipCard(card) {
            if(isLocked) return;
            if(card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if(flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkForMatch();
            }
        }

        function checkForMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.symbol === card2.dataset.symbol;

            if(match) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                flippedCards = [];
                matchedPairs++;

                if(matchedPairs === symbols.length / 2) {
                    clearInterval(timerInterval);
                    setTimeout(showWinModal, 500);
                }
            } else {
                isLocked = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    isLocked = false;
                }, 800);
            }
        }

        function showWinModal() {
            const mins = Math.floor(timer / 60);
            const secs = timer % 60;
            document.getElementById('win-stats').innerHTML = `Você completou o jogo em <strong class="text-sakura-600">${moves} movimentos</strong> e <strong class="text-sakura-600">${mins}m ${secs}s</strong>!`;
            document.getElementById('win-modal').classList.remove('hidden');
            document.getElementById('win-modal').classList.add('flex');
            showToast("Incrível! Você concluiu o jogo!", "🎉");
        }

        function closeWinModal() {
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('win-modal').classList.remove('flex');
        }

        window.addEventListener('DOMContentLoaded', startGame);
    </script>
</body>
</html>
